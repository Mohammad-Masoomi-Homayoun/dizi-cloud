spring:
  application:
    name: dizi-cloud
  artemis:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
  jms:
    template:
      default-destination: dizi-cloud.order.queue

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    template:
      routing-key: kitchens.central
      exchange: dizi-cloud.order
      default-receive-queue: kitchens.central

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:dizicloud
    username: sa
    password: ""
    generate-unique-name: false

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.dizi.dz.controller: INFO