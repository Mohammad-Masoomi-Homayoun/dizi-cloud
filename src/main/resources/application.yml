spring:
  application:
    name: dizi-cloud
  artemis:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin
  jms:
    template:
      default-destination: dizi-cloud.order.queue

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    template:
      routing-key: kitchens.central
      exchange: dizi-cloud.order
      default-receive-queue: kitchens.central

  kafka:
    bootstrap-servers:
      - localhost:29092
    template:
      default-topic: dizi-cloud.orders.topic
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      bootstrap-servers: localhost:29092
      group-id: dz-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.dizi.dz.entity

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:dizicloud
    username: sa
    password: ""
    generate-unique-name: false

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.dizi.dz.controller: INFO