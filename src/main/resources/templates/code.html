<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Display OAuth2 Code</title>
    <style>
        body {
            font-family: monospace, monospace;
            margin: 2rem;
            background-color: #f0f0f0;
        }
        pre {
            background-color: #272822;
            color: #f8f8f2;
            padding: 1rem;
            border-radius: 5px;
            overflow-x: auto;
            max-width: 90vw;
        }
    </style>
</head>
<body>

<h1>OAuth2 Code Parameter</h1>
<p>The <code>code</code> parameter from the URL is:</p>
<pre id="codeValue">Loading...</pre>

<script>
    function getQueryParam(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
    }

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    const code = getQueryParam('code');
    const pre = document.getElementById('codeValue');

    if (code) {
        pre.textContent = code; // safer to set textContent than innerHTML
    } else {
        pre.textContent = "No 'code' parameter found in URL.";
    }
</script>

</body>
</html>
